name: Evergreen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Scan lifecycle risks
        uses: arminazimi/evergreen@v0.7.2
        with:
          baseline: .evergreen-baseline.json
          fail-on-severity: high
