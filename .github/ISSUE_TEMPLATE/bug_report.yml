name: Bug report
description: Report reproducible incorrect behavior in CineGraph
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest dataset, query, and spoiler horizon that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CineGraph version
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Logs, output, or other useful context. Remove private data first.

